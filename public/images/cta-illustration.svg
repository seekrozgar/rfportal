<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#11998e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#38ef7d;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f8fafc;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e8f5f0;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="400" height="300" fill="url(#grad2)" rx="20"/>

  <!-- Decorative Elements -->
  <circle cx="50" cy="50" r="25" fill="#11998e" opacity="0.08"/>
  <circle cx="350" cy="250" r="30" fill="#38ef7d" opacity="0.08"/>
  <circle cx="380" cy="50" r="15" fill="#11998e" opacity="0.06"/>

  <!-- Rocket / Growth Icon -->
  <g transform="translate(200, 140)">
    <!-- Rocket Body -->
    <ellipse cx="0" cy="10" rx="30" ry="40" fill="url(#grad1)" opacity="0.15"/>
    <ellipse cx="0" cy="10" rx="20" ry="28" fill="url(#grad1)" opacity="0.3"/>
    <ellipse cx="0" cy="10" rx="10" ry="16" fill="url(#grad1)" opacity="0.5"/>

    <!-- Rocket Window -->
    <circle cx="0" cy="5" r="6" fill="white" opacity="0.8"/>
    <circle cx="0" cy="5" r="4" fill="#11998e"/>

    <!-- Rocket Fins -->
    <path d="M-15,35 L-25,50 L-10,45 Z" fill="#11998e" opacity="0.4"/>
    <path d="M15,35 L25,50 L10,45 Z" fill="#11998e" opacity="0.4"/>

    <!-- Rocket Fire -->
    <path d="M-8,48 L0,65 L8,48 Z" fill="#38ef7d" opacity="0.6"/>
    <path d="M-5,50 L0,60 L5,50 Z" fill="#11998e" opacity="0.4"/>

    <!-- Stars -->
    <circle cx="-40" cy="-20" r="3" fill="#11998e" opacity="0.3"/>
    <circle cx="-30" cy="-35" r="2" fill="#38ef7d" opacity="0.3"/>
    <circle cx="35" cy="-25" r="3" fill="#11998e" opacity="0.3"/>
    <circle cx="25" cy="-40" r="2" fill="#38ef7d" opacity="0.3"/>
    <circle cx="0" cy="-50" r="4" fill="#11998e" opacity="0.2"/>
    <circle cx="-20" cy="-55" r="2" fill="#38ef7d" opacity="0.2"/>
    <circle cx="20" cy="-55" r="2" fill="#11998e" opacity="0.2"/>
  </g>

  <!-- Arrow Up -->
  <text x="200" y="240" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#11998e" font-weight="600">🚀 Grow Your Career</text>

  <!-- Bottom Decor -->
  <rect x="100" y="260" width="200" height="4" rx="2" fill="url(#grad1)" opacity="0.15"/>
</svg>
