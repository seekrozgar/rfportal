<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" width="500" height="400">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#11998e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#38ef7d;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e8f5f0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f8fafc;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="500" height="400" fill="url(#grad2)" rx="20"/>

  <!-- Decorative Circles -->
  <circle cx="100" cy="50" r="30" fill="#11998e" opacity="0.1"/>
  <circle cx="400" cy="300" r="40" fill="#38ef7d" opacity="0.1"/>
  <circle cx="450" cy="80" r="20" fill="#11998e" opacity="0.08"/>

  <!-- Search Icon -->
  <circle cx="250" cy="180" r="60" fill="url(#grad1)" opacity="0.15"/>
  <circle cx="250" cy="180" r="45" fill="url(#grad1)" opacity="0.25"/>
  <circle cx="250" cy="180" r="30" fill="url(#grad1)" opacity="0.4"/>

  <!-- Magnifying Glass -->
  <circle cx="250" cy="180" r="25" fill="none" stroke="#11998e" stroke-width="6"/>
  <line x1="268" y1="198" x2="285" y2="215" stroke="#11998e" stroke-width="6" stroke-linecap="round"/>

  <!-- People Icons -->
  <!-- Person 1 -->
  <circle cx="180" cy="280" r="10" fill="#11998e" opacity="0.6"/>
  <circle cx="180" cy="260" r="8" fill="#11998e" opacity="0.6"/>

  <!-- Person 2 -->
  <circle cx="210" cy="285" r="10" fill="#38ef7d" opacity="0.6"/>
  <circle cx="210" cy="265" r="8" fill="#38ef7d" opacity="0.6"/>

  <!-- Person 3 -->
  <circle cx="290" cy="280" r="10" fill="#11998e" opacity="0.6"/>
  <circle cx="290" cy="260" r="8" fill="#11998e" opacity="0.6"/>

  <!-- Job Cards -->
  <rect x="130" y="310" width="40" height="25" rx="4" fill="#11998e" opacity="0.15"/>
  <rect x="180" y="315" width="40" height="25" rx="4" fill="#38ef7d" opacity="0.15"/>
  <rect x="230" y="310" width="40" height="25" rx="4" fill="#11998e" opacity="0.15"/>
  <rect x="280" y="315" width="40" height="25" rx="4" fill="#38ef7d" opacity="0.15"/>

  <!-- Dots -->
  <circle cx="330" cy="340" r="4" fill="#11998e" opacity="0.3"/>
  <circle cx="345" cy="340" r="4" fill="#38ef7d" opacity="0.3"/>
  <circle cx="360" cy="340" r="4" fill="#11998e" opacity="0.3"/>

  <!-- Text Labels -->
  <text x="250" y="370" text-anchor="middle" font-family="Open Sans, calibri" font-size="14" fill="#11998e" font-weight="600">Find Your Dream Job</text>
</svg>
